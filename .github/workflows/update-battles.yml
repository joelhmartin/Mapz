name: Update battles

# Wikidata isn't reachable from every dev environment, so battles and wars are
# fetched here and committed to the repo, along with the wars layer built from them.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch-battles.mjs
      - scripts/fetch-wars.mjs
      - scripts/build-wars.mjs
      - scripts/lib/wikidata.mjs
      - .github/workflows/update-battles.yml
  schedule:
    - cron: '17 4 1 * *' # monthly

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-battles.mjs
      - run: node scripts/fetch-wars.mjs
      - run: node scripts/build-wars.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/data/battles.geojson public/data/wars.geojson public/data/wars.json data/wikidata/wars.json
          git diff --cached --quiet || git commit -m "Update battles and wars from Wikidata"
          git push
