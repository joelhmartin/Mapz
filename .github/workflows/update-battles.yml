name: Update battles

# Wikidata isn't reachable from every dev environment, so the battle data is
# fetched here and committed to the repo.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *' # monthly

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-battles.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/data/battles.geojson
          git diff --cached --quiet || git commit -m "Update battles from Wikidata"
          git push
